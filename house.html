<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>音樂遊樂場</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2a33;--muted:#6f6a7c;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Noto Sans TC',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(circle at 20% 10%,#f6e7ff 0,transparent 40%),radial-gradient(circle at 85% 90%,#e3ecff 0,transparent 45%),linear-gradient(#fbf6ff,#f1e8ff);}
#menu{min-height:100%;display:flex;flex-direction:column}
header{text-align:center;padding:4vh 16px 2vh;position:relative}
h1{margin:0;font-size:clamp(30px,5.5vw,56px);font-weight:900;letter-spacing:.08em;color:#5b2d9e;text-shadow:0 3px 0 #e2d0ff}
.sub{color:var(--muted);font-size:clamp(14px,1.9vw,19px);margin-top:6px}
.spark{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.spark i{position:absolute;font-style:normal;font-size:24px;opacity:.5;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.1;transform:scale(.7) rotate(20deg)}}
main{max-width:1100px;width:100%;margin:0 auto;padding:6px 20px 60px;flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:34px 20px;padding-top:10px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;animation:fl 4.4s ease-in-out infinite}
.card:nth-child(2){animation-delay:-1.1s}.card:nth-child(3){animation-delay:-2.2s}.card:nth-child(4){animation-delay:-3.3s}
@keyframes fl{50%{transform:translateY(-10px)}}
.orb{position:relative;width:clamp(170px,19vw,210px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.95) 0,rgba(255,255,255,.35) 14%,transparent 30%),
  radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--c) 30%,#fff) 0,color-mix(in srgb,var(--c) 72%,#fff) 55%,var(--c) 100%);
  box-shadow:inset -14px -18px 34px rgba(0,0,0,.22),inset 10px 10px 26px rgba(255,255,255,.55),0 0 34px color-mix(in srgb,var(--c) 55%,transparent),0 16px 22px rgba(60,30,110,.25);
  transition:transform .15s,box-shadow .15s}
.orb::after{content:"";position:absolute;right:16%;bottom:12%;width:22%;height:9%;border-radius:50%;background:rgba(255,255,255,.45);transform:rotate(-35deg);filter:blur(2px)}
.card:hover .orb{transform:scale(1.06);box-shadow:inset -14px -18px 34px rgba(0,0,0,.22),inset 10px 10px 26px rgba(255,255,255,.6),0 0 52px var(--c),0 16px 22px rgba(60,30,110,.25)}
.card:active .orb{transform:scale(.97)}
.card .ico{font-size:clamp(56px,7vw,74px);line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3));position:relative;z-index:1}
.base{width:62%;height:16px;margin-top:-12px;border-radius:0 0 40% 40%/0 0 100% 100%;background:linear-gradient(#8d6a3c,#5b3f1e);box-shadow:0 6px 8px rgba(60,30,10,.3);position:relative;z-index:-1}
.card .nm{font-size:24px;font-weight:900;color:var(--c);margin-top:6px}
.card .ds{color:var(--muted);font-size:14px;line-height:1.5;max-width:230px}
.card .go{background:var(--c);color:#fff;font-weight:900;border-radius:14px;padding:4px 16px;font-size:15px}
.card .tag{position:absolute;top:2px;right:10%;z-index:2;font-size:12px;font-weight:700;background:#fff;color:var(--muted);border-radius:10px;padding:2px 10px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.card.soon{cursor:not-allowed;animation:none}
.card.soon .orb{filter:grayscale(.85) brightness(1.05);opacity:.6}
.card.soon .nm,.card.soon .ds{opacity:.6}.card.soon .go{background:#aaa}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
#play{position:fixed;inset:0;display:none;flex-direction:column;background:#fff;z-index:5}
#play.on{display:flex}
.bar{display:flex;align-items:center;gap:12px;padding:6px 10px;background:#5b2d9e;color:#fff;flex:none}
.bar button{border:none;border-radius:12px;background:#fff;color:#5b2d9e;font:inherit;font-weight:900;padding:6px 14px;cursor:pointer}
.bar b{font-size:18px}
.bar a{margin-left:auto;color:#e9dcff;font-size:13px}
#gf{flex:1;border:0;width:100%;background:#fff}
</style>
</head>
<body>
<div id="menu">
  <header>
    <div class="spark"><i style="left:8%;top:25%">✨</i><i style="left:20%;top:70%;animation-delay:1s">🎵</i><i style="right:9%;top:30%;animation-delay:.6s">✨</i><i style="right:22%;top:70%;animation-delay:1.6s">🎶</i></div>
    <h1>🔮 音樂遊樂場</h1>
    <div class="sub">選一個遊戲，開始挑戰吧！</div>
  </header>
  <main><div class="grid" id="games"></div></main>
</div>
<div id="play"><div class="bar"><button id="back">◀ 回音樂遊樂場</button><b id="gname"></b><a id="gnew" target="_blank" rel="noopener">在新分頁開啟</a></div><iframe id="gf" allow="autoplay;fullscreen" title="遊戲"></iframe></div>
<script>
/* ===== 音樂遊樂場的遊戲清單：要新增或修改，改這裡就好 =====
   url 留空 ''，卡片會顯示「即將推出」並且不能點。                       */
const GAMES=[
  {icon:'🫧',name:'唱名泡泡',desc:'唱名泡泡掉下來，跟著節奏點出正確的音！',url:'https://weimusic.github.io/NOTE-GAME/',color:'#2e86de',tag:'個人'},
  {icon:'🎲',name:'學樂大富翁',desc:'擲骰子、答反覆記號的題目，買地蓋房子！',url:'https://weimusic.github.io/repeat-signs/',color:'#e4572e',tag:'分組・平板'},
  {icon:'🗺️',name:'音樂搶地盤',desc:'五隊搶星星地圖，答對就能佔領地盤！',url:'',color:'#8e5cd9',tag:'分組'},
  {icon:'🔍',name:'音樂解謎室',desc:'解開簡譜、唱名和五線譜的密碼！',url:'',color:'#e0a100',tag:'小隊'}
];
const $=id=>document.getElementById(id);
$('games').innerHTML=GAMES.map((g,i)=>`<button class="card${g.url?'':' soon'}" data-i="${i}" style="--c:${g.color}" ${g.url?'':'aria-disabled="true"'}>
  ${g.tag?`<span class="tag">${g.tag}</span>`:''}<div class="orb"><span class="ico">${g.icon}</span></div><div class="base"></div><div class="nm">${g.name}</div><div class="ds">${g.desc}</div>
  <span class="go">${g.url?'開始玩 ▶':'即將推出'}</span></button>`).join('');
$('games').onclick=e=>{const b=e.target.closest('.card');if(!b)return;const g=GAMES[+b.dataset.i];if(!g.url)return;
  $('gname').textContent=g.icon+' '+g.name;$('gnew').href=g.url;$('gf').src=g.url;$('play').classList.add('on');};
$('back').onclick=()=>{$('play').classList.remove('on');$('gf').src='about:blank';};
</script>
</body>
</html>
